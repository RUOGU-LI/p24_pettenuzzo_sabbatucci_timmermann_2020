name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # CI has no WRDS account. Unit tests and the end-to-end test on
      # simulated data run here; tests that compare with the published paper
      # need real CRSP data and skip themselves.
      USE_SYNTHETIC_DATA: "1"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt
    - name: Install test dependencies
      run: pip install -r requirements.txt
    - name: Run tests
      run: pytest
